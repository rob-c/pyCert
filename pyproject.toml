# Metadata lives in setup.cfg so that Python 3.6 can build from source with
# setuptools 59.  PEP 621 ([project]) requires setuptools >= 61, which needs
# Python >= 3.7; a marker below selects a compatible build backend per version.
[build-system]
requires = [
  "setuptools>=59.6; python_version < '3.8'",
  "setuptools>=68; python_version >= '3.8'",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:pycert.*"]

[tool.ruff]
line-length = 110
target-version = "py311"  # ruff has no py36 target; see the ignore list for deliberate 3.6 style

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "PT"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "E741",   # `l` is the locality attribute in the CA protocol (OU/L)
  "SIM105", # contextlib.suppress is not always clearer
  "PT011",  # pytest.raises(...) without match= is fine in tests
  "PT006",  # parametrize with a comma-separated string is readable
  "PT018",  # compound assertions are fine in tests
  # pyCert targets Python 3.6, so typing.List/Optional and timezone.utc are correct.
  "UP006",
  "UP007",
  "UP017",
  "UP031",  # percent formatting is intentional in 3.6-compatible code
  "UP035",
  "UP037",  # quoted forward references are required without __future__ annotations
  "UP041",  # socket.timeout is the documented 3.6 name
  "UP045",
  "B009",   # deliberate getattr probing of newer cryptography attributes
  "B904",   # the exception text is included in the new message
  "B905",   # zip(strict=...) is 3.10+
]
