[metadata]
name = pycert
version = 1.0.0
description = Request, wait for, download and export UK e-Science CA certificates (a CertWizard replacement)
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL-2.0-or-later
license_files = LICENSE
author = pyCert contributors
keywords = x509, pkcs12, pki, certificate, escience, certwizard
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Environment :: X11 Applications
    Intended Audience :: System Administrators
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Security :: Cryptography
    Topic :: System :: Systems Administration

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    cryptography>=3.0
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.package_data]
pycert =
    data/ca/*.pem

[options.extras_require]
dev =
    pytest>=8; python_version >= "3.8"
    ruff>=0.6
    vermin>=1.6

[options.entry_points]
console_scripts =
    pycert = pycert.cli:main
    pycert-gui = pycert.gui:main
