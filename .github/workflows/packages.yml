name: Packages

# Builds every distributable form of pyCertWiz and tests each one, installed the
# way a user would, end to end against the repository's sandbox CA:
#
#   * wheel and sdist (PyPI)
#   * Linux x86_64 and aarch64: AppImage, .deb, .rpm, Arch package, tarball
#   * macOS arm64 and x86_64: pyCertWiz.app in a .dmg (signed ad hoc; sign and
#     notarize locally with packaging/macos/sign-and-notarize.sh)
#   * the Nix flake
#
# release.yml runs this workflow for a tag and publishes what it builds.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine "cryptography>=42"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install "$(ls dist/*.whl)[gui,keyring]"
      - name: End-to-end test against the sandbox CA
        run: |
          PYTHON=python packaging/tests/start-sandbox.sh "$RUNNER_TEMP/sandbox" 8443
          packaging/tests/smoke.sh "$RUNNER_TEMP/wheel/bin/pycertwiz" "$RUNNER_TEMP/sandbox" https://localhost:8443
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28: runs on RHEL/AlmaLinux 8, Debian 10, Ubuntu 20.04 and newer
          - { arch: x86_64, runner: ubuntu-24.04, image: "almalinux:8" }
          # PySide6's aarch64 wheels need glibc 2.39 (Ubuntu 24.04, Debian 13, EL10)
          - { arch: aarch64, runner: ubuntu-24.04-arm, image: "almalinux:10" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle Python, Qt and pyCertWiz on ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" packaging/linux/build.sh
      - run: sudo chown -R "$(id -u):$(id -g)" .
      - name: AppImage, .deb, .rpm and Arch package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/linux/package.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  linux-test:
    name: ${{ matrix.format }} on ${{ matrix.image }} ${{ matrix.arch }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, format: deb, image: "ubuntu:22.04" }
          - { arch: x86_64, format: deb, image: "ubuntu:24.04", x11: 1 }
          - { arch: x86_64, format: deb, image: "debian:12" }
          - { arch: x86_64, format: deb, image: "debian:13", x11: 1 }
          - { arch: x86_64, format: rpm, image: "almalinux:8" }
          - { arch: x86_64, format: rpm, image: "almalinux:9", x11: 1 }
          - { arch: x86_64, format: rpm, image: "almalinux:10" }
          - { arch: x86_64, format: rpm, image: "fedora:latest", x11: 1 }
          - { arch: x86_64, format: rpm, image: "opensuse/tumbleweed" }
          - { arch: x86_64, format: archlinux, image: "archlinux:latest", x11: 1 }
          - { arch: x86_64, format: appimage, image: "almalinux:8" }
          - { arch: x86_64, format: appimage, image: "ubuntu:24.04", x11: 1 }
          - { arch: aarch64, format: deb, image: "ubuntu:24.04", x11: 1 }
          - { arch: aarch64, format: deb, image: "debian:13" }
          - { arch: aarch64, format: rpm, image: "almalinux:10" }
          - { arch: aarch64, format: rpm, image: "fedora:latest", x11: 1 }
          - { arch: aarch64, format: appimage, image: "ubuntu:24.04" }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install in a clean container; test end to end
        env:
          SMOKE_X11: ${{ matrix.x11 || 0 }}
        run: packaging/tests/container-test.sh "${{ matrix.image }}" "${{ matrix.format }}"

  macos:
    name: macOS ${{ matrix.arch }} (.app, .dmg)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHON=python packaging/macos/build-app.sh
      - name: End-to-end test of the app in the .dmg
        run: |
          pip install "cryptography>=42"
          PYTHON=python packaging/tests/start-sandbox.sh "$RUNNER_TEMP/sandbox" 8443
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/pyCertWiz-*.dmg
          packaging/tests/smoke.sh "$RUNNER_TEMP/dmg/pyCertWiz.app/Contents/MacOS/pyCertWiz" "$RUNNER_TEMP/sandbox" https://localhost:8443
      - name: Open the window on the runner's display (Cocoa)
        run: env -u QT_QPA_PLATFORM "$RUNNER_TEMP/dmg/pyCertWiz.app/Contents/MacOS/pyCertWiz" gui --check
      - run: codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/pyCertWiz.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
      - run: nix build -L .#default
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: End-to-end test against the sandbox CA
        run: |
          pip install "cryptography>=42"
          PYTHON=python packaging/tests/start-sandbox.sh "$RUNNER_TEMP/sandbox" 8443
          packaging/tests/smoke.sh "$PWD/result/bin/pycertwiz" "$RUNNER_TEMP/sandbox" https://localhost:8443
