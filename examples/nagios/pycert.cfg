# Nagios / Icinga 1.x command and service for pyCertWiz.
#
# 'pycert check' follows the monitoring-plugin convention: one summary line
# with performance data, exit 0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN.  It
# reports expiring and expired certificates, requests stuck at the RA,
# unverified chains and deployed files that differ from the stored certificate.
#
# Run it as the user that owns the pyCertWiz configuration (e.g. via NRPE).

define command {
    command_name    check_pycert
    command_line    /usr/local/bin/pycert --config $ARG1$ check --warn $ARG2$ --crit $ARG3$
}

define service {
    use                     generic-service
    host_name               grid-ui.example.ac.uk
    service_description     Grid certificates
    check_command           check_pycert!/etc/pycert/pycert.toml!30!7
    check_interval          360
}

# NRPE (nrpe.cfg):
# command[check_pycert]=/usr/local/bin/pycert --config /etc/pycert/pycert.toml check --warn 30 --crit 7
