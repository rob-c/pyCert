[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCertWiz"
version = "2.0.1"
description = "Certificate manager for the UK e-Science CA and ACME CAs: request, track, renew, deploy and export user and host certificates (a CertWizard replacement)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "pyCertWiz contributors" }]
requires-python = ">=3.10"
keywords = ["x509", "pkcs12", "pki", "certificate", "escience", "certwizard", "acme", "igtf"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Environment :: MacOS X",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "cryptography>=42",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The graphical interface (pycert gui / pycert-gui).
gui = ["PySide6-Essentials>=6.6"]
# Optional OS keyring integration (macOS Keychain, Secret Service, KWallet, Windows).
keyring = ["keyring>=24"]
all = ["pyCertWiz[gui,keyring]"]
dev = [
  "pyCertWiz[gui,keyring]",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-qt>=4.4",
  "pytest-xdist>=3.5",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
pycert = "pycert.cli:main"
pycertwiz = "pycert.cli:main"

[project.gui-scripts]
pycert-gui = "pycert.gui:main"
pycertwiz-gui = "pycert.gui:main"

[project.urls]
Source = "https://github.com/rob-c/pyCertWiz"
Issues = "https://github.com/rob-c/pyCertWiz/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycert = ["data/ca/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
filterwarnings = [
  "error::DeprecationWarning:pycert.*",
]

[tool.coverage.run]
source = ["src/pycert"]
branch = true
relative_files = true   # so data from Linux and macOS jobs can be combined

[tool.coverage.paths]
source = ["src/pycert", "*/src/pycert"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  'raise AssertionError\("unreachable"\)',
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "C4", "PT"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "E741",   # `l` is the locality attribute in the CA protocol (OU/L)
  "SIM105", # contextlib.suppress is not always clearer
  "PT011",  # pytest.raises(...) without match= is fine in tests
  "PT006",  # parametrize with a comma-separated string is readable
  "PT018",  # compound assertions are fine in tests
  "UP031",  # percent formatting is used in a few log messages
  "UP037",  # quoted annotations are harmless and kept for readability
  "B904",   # the exception text is included in the new message
  "B905",   # zip(strict=...) is not needed for equal-length pairs
]
